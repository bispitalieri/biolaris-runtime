name: Biolaris runtime assets

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/runtime-assets.yml"
      - "scripts/**"
      - "package.json"
      - "README.md"
      - "LICENSE"
  pull_request:
    paths:
      - ".github/workflows/runtime-assets.yml"
      - "scripts/**"
      - "package.json"
      - "README.md"
      - "LICENSE"
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  group: biolaris-runtime-assets
  cancel-in-progress: false

jobs:
  build:
    name: Build runtime (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-26
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set default Windows toolchain (MSVC)
        if: runner.os == 'Windows'
        run: rustup default stable-x86_64-pc-windows-msvc
        shell: bash

      - name: Generate runtime
        run: npm run binaries:download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive runtime and create checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p runtime-assets
          archive="biolaris-runtime-${TARGET}.tar.gz"
          tar -czf "runtime-assets/${archive}" -C dist "${TARGET}"
          checksum="$(node -e 'const {createHash}=require("node:crypto"); const {readFileSync}=require("node:fs"); process.stdout.write(createHash("sha256").update(readFileSync(process.argv[1])).digest("hex"))' "runtime-assets/${archive}")"
          printf '%s  %s\n' "$checksum" "$archive" > "runtime-assets/${archive}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: biolaris-runtime-${{ matrix.target }}
          path: runtime-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish runtime release assets
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: biolaris-runtime-*
          path: runtime-assets
          merge-multiple: true

      - name: Create or update runtime release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view runtime-latest >/dev/null 2>&1; then
            gh release create runtime-latest \
              --target "$GITHUB_SHA" \
              --title "Biolaris runtime assets" \
              --notes "Automated platform runtime bundles. Generated by the Biolaris runtime workflow." \
              --prerelease
          else
            gh release edit runtime-latest \
              --title "Biolaris runtime assets" \
              --notes "Automated platform runtime bundles. Generated by the Biolaris runtime workflow." \
              --prerelease
          fi

          while IFS= read -r -d '' asset; do
            gh release upload runtime-latest "$asset" --clobber
          done < <(find runtime-assets -type f -print0)
